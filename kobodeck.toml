[Server]
URL = "https://readeck.com"
# Obtain this from your Readeck instance
Token = ""
# HTTP request timeout in seconds
Timeout = 300

[Fetch]
# Number of parallel article downloads
Workers = 2
# Number of articles to fetch (0 = all)
Limit = 0
# Only fetch articles based on readeck bookmarks with these labels (comma-separated, empty: all)
Labels = ""
# Only fetch articles with these read statuses (comma-separated: unread, reading, read; empty: all non-archived)
Status = "unread,reading"

[Sync]
# Articles completed on the Kobo are marked as read on Readeck.
# Also archive completed articles when enabled.
Archive = true
# Articles in the following collection
# will be set as favourite in Readeck
# (empty: disabled)
FavouriteCollection = ""

[Log]
# The log will be written to the same directory as this config
Verbose = false
# Max log file size in MB
Size = 1

[Output]
# Directory dedicated to Kobodeck-downloaded (K)EPUB files
# If it does not exist, it will be created
Path = "/mnt/onboard/kobodeck"
# Delete every top-level *.kepub.epub that is absent from the fetched feed,
# including books excluded by Fetch filters or Fetch.Limit
# Do not enable this for a directory containing unrelated books
Delete = false
